name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install -e python/practify-scanner
          pip install -e python/practify
          pip install pytest

      - name: Run unit tests
        run: python -m pytest --rootdir=python python/tests -q

  self-scan:
    runs-on: ubuntu-latest
    name: Scanner self-scan (First Law reflexively)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner
        run: pip install -e python/practify-scanner

      # The protocol's own code must pass through its own scanner without
      # crashing — scanner scanning scanner is Second Law applied to itself.
      # Findings are expected at current maturity; the hard requirement is
      # that the scanner parses its own code and produces a report.
      - name: Scan practify's own source
        run: |
          python -m practify_scanner check python || \
            echo "Self-scan produced findings (expected); scanner parsed its own code without crashing."
