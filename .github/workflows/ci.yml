name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      # One version failing must not cancel the others: on 2026-11-13 an
      # image-level 3.9 failure cancelled 3.10/3.11/3.12 before they ran, which
      # reads like a code regression instead of a runner problem.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    # `ubuntu-latest` is now ubuntu-26.04, whose image no longer publishes
    # Python 3.9 ("The version '3.9' with architecture 'x64' was not found for
    # Ubuntu 26.04"). 3.9 keeps being verified on the last image that still
    # ships it, so `requires-python = ">=3.9"` in both pyproject.toml files
    # stays a tested claim rather than a stale one. Drop the 3.9 row (and the
    # floor in both pyproject.toml files) once 3.9 support is retired.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install -e python/anchorlaw-scanner
          pip install -e python/anchorlaw
          pip install pytest

      - name: Run unit tests
        run: python -m pytest --rootdir=python python/tests -q

  self-scan:
    runs-on: ubuntu-latest
    name: Scanner self-scan (First Law reflexively)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner
        run: pip install -e python/anchorlaw-scanner

      # The protocol's own code must pass through its own scanner without
      # crashing - scanner scanning scanner is Second Law applied to itself.
      # Findings are expected at current maturity; the hard requirement is
      # that the scanner parses its own code and produces a report.
      - name: Scan anchorlaw's own source
        run: |
          python -m anchorlaw_scanner check python || \
            echo "Self-scan produced findings (expected); scanner parsed its own code without crashing."
